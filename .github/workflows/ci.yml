name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run format check
        run: pnpm format:check

      - name: Run lint
        run: pnpm lint

      - name: Run build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --dir examples/next exec playwright install --with-deps --only-shell chromium

      - name: Run changelog end-to-end tests
        run: pnpm --dir examples/next exec playwright test e2e/changelog.spec.ts --workers=1

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run website build
        run: pnpm build
        working-directory: website

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build Next adapter test dependencies
        run: pnpm --filter @farming-labs/theme build

      - name: Run Next adapter tests
        run: pnpm --filter @farming-labs/next test

      - name: Run TanStack Start adapter tests
        run: pnpm --filter @farming-labs/tanstack-start test

      - name: Run Fumadocs theme tests
        run: pnpm --filter @farming-labs/theme test

      - name: Test deployed agent surface smoke validator
        run: pnpm test:smoke-agent-surfaces

      - name: Run Nuxt adapter tests
        run: pnpm --filter @farming-labs/nuxt test

      - name: Run Astro adapter tests
        run: pnpm --filter @farming-labs/astro test

      - name: Run Svelte adapter tests
        run: pnpm --filter @farming-labs/svelte test
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.9.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies (root + frontend)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "pnpm-lock.yaml" ]; then
            echo "✅ pnpm-lock.yaml found, installing with frozen lockfile"
            pnpm install --frozen-lockfile
          else
            echo "⚠️ pnpm-lock.yaml not found, installing without frozen lockfile"
            pnpm install
          fi

          if [ -d "frontend" ]; then
            echo "📦 Installing frontend dependencies..."
            pushd frontend >/dev/null
            pnpm install --frozen-lockfile || pnpm install
            popd >/dev/null
          fi
      - name: Run security audit
        shell: bash
        run: |
          set -euo pipefail

          AUDIT_TREE_FILE="$(mktemp)"
          trap 'rm -f "$AUDIT_TREE_FILE"' EXIT

          pnpm list -r --json --depth Infinity > "$AUDIT_TREE_FILE"
          node --test scripts/security-audit.test.mjs
          node scripts/security-audit.mjs \
            "$AUDIT_TREE_FILE" \
            .github/security-audit-allowlist.json
