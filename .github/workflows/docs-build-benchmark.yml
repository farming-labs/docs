name: Docs build benchmark
on:
  workflow_dispatch:
    inputs:
      pages:
        description: Pages per framework
        default: '100'
        type: string
      trials:
        description: Repeated serial trials
        default: '3'
        type: string
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          npm ci --prefix benchmark/next-docs/deps --legacy-peer-deps --ignore-scripts
          pnpm exec playwright install --with-deps chromium
      - name: Build packages outside measurement
        run: |
          pnpm --filter @farming-labs/docs build
          pnpm --filter @farming-labs/theme build
          pnpm --filter @farming-labs/next build
      - name: Measure isolated configuration startup
        run: |
          mkdir -p benchmark/next-docs/artifacts
          node packages/next/scripts/benchmark-config-startup.mjs > benchmark/next-docs/artifacts/config-startup.json
      - name: Capture runner
        run: |
          mkdir -p benchmark/next-docs/artifacts
          lscpu > benchmark/next-docs/artifacts/runner.txt
          free -m >> benchmark/next-docs/artifacts/runner.txt
      - name: Compare configuration imports with Fumadocs control
        env:
          BENCH_PAGES: ${{ inputs.pages }}
          BENCH_TRIALS: ${{ inputs.trials }}
        run: python3 benchmark/next-docs/compare-config-imports.py --pages "$BENCH_PAGES" --trials "$BENCH_TRIALS" --run-id "ci-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-docs-config-imports-${{ github.run_id }}
          retention-days: 30
          path: |
            benchmark/next-docs/artifacts/runner.txt
            benchmark/next-docs/artifacts/config-startup.json
            benchmark/next-docs/artifacts/ci-*/*.json
            benchmark/next-docs/artifacts/ci-*/*.log
            benchmark/next-docs/artifacts/ci-*/*.png
